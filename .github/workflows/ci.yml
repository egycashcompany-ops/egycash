name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    # A step that hangs (a test runner that finishes its suites but never exits) used to sit
    # here until the six-hour default killed it. Fail in twenty minutes instead: a green run
    # takes about five.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Before anything is installed: a committed credential fails the run on its own, whatever
      # else the change did. Tracked files only, high-confidence rules, fingerprint allowlist.
      - name: No secrets in the tree (Security Architecture §4)
        run: node scripts/check-secrets.mjs

      - name: Install
        run: npm ci

      - name: Build contracts
        run: npm run build -w packages/contracts

      - name: Lint (incl. boundary rules)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Permission matrix is generated from the code catalog (Review R18)
        run: node scripts/gen-permission-matrix.mjs --check

      - name: Feature flags past expiry fail CI (Review R27)
        run: node scripts/check-flag-expiry.mjs

      - name: Page registry is declared, resolvable and non-empty (P7-A)
        run: node scripts/check-page-registry.mjs

      - name: Automation template packages parse against their contract (A-9a)
        run: node scripts/automation-templates.mjs

      - name: The Arabic the product speaks is formal Arabic
        run: node scripts/check-formal-arabic.mjs

      # One step per workspace rather than `--workspaces`. That form runs every workspace and
      # reports the aggregate at the end, so a failure in an early workspace ends up buried under
      # thousands of lines from the ones that ran after it — the log tail shows a passing suite and
      # the step name says only "Test". Split, the step name is the diagnosis and the failing
      # output is the last thing in the log.
      - name: Test — contracts
        run: npm run test -w packages/contracts

      - name: Test — api
        run: npm run test -w apps/api

      - name: Test — web
        run: npm run test -w apps/web

      - name: Build
        run: npm run build

      # High AND critical advisories in production dependencies fail the run; a registry outage
      # fails it too, unless a reviewer has recorded a dated outage waiver. Individual advisories
      # are waived by id, with a reason and an expiry that fails the run once it passes — see
      # scripts/dependency-audit.waivers.json. Lower severities are reported for Dependabot.
      - name: Dependency audit (high/critical block; outage is not a pass)
        run: node scripts/dependency-audit.mjs
