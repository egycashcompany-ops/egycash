name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    # A step that hangs (a test runner that finishes its suites but never exits) used to sit
    # here until the six-hour default killed it. Fail in twenty minutes instead: a green run
    # takes about five.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build contracts
        run: npm run build -w packages/contracts

      - name: Lint (incl. boundary rules)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Permission matrix is generated from the code catalog (Review R18)
        run: node scripts/gen-permission-matrix.mjs --check

      - name: Feature flags past expiry fail CI (Review R27)
        run: node scripts/check-flag-expiry.mjs

      - name: Automation template packages parse against their contract (A-9a)
        run: node scripts/automation-templates.mjs

      - name: Test
        run: npm run test --workspaces --if-present

      - name: Build
        run: npm run build

      # The advisory gate needs npmjs.com's audit endpoints. When they are down or
      # mid-migration (2026-07-26: the quick endpoint was retired and the bulk endpoint
      # started returning gzip bodies npm cannot parse) the audit CANNOT run at all —
      # degrade to a workflow warning instead of failing every pipeline on a registry
      # outage. A REAL critical advisory in production dependencies still fails the run.
      - name: Dependency audit
        run: |
          out=$(npm audit --omit=dev --audit-level=critical --json 2>/dev/null || true)
          crit=$(printf '%s' "$out" | node -e '
            let d = "";
            process.stdin.on("data", (c) => (d += c)).on("end", () => {
              try {
                const v = JSON.parse(d).metadata?.vulnerabilities?.critical;
                process.stdout.write(v === undefined ? "" : String(v));
              } catch { process.stdout.write(""); }
            });')
          if [ -z "$crit" ]; then
            echo "::warning::npm audit advisory endpoints unavailable — dependency audit skipped this run"
            exit 0
          fi
          if [ "$crit" != "0" ]; then
            npm audit --omit=dev --audit-level=critical || true
            echo "::error::${crit} critical vulnerabilities in production dependencies"
            exit 1
          fi
          echo "dependency audit clean: 0 critical vulnerabilities"
