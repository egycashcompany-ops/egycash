<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECMS</title>

    <!--
      Installable-app metadata. Without a manifest Chrome's menu offers only "Create shortcut",
      which opens a browser tab wearing an icon; with one it offers "Install", which opens a real
      app window. Each href below opens on Vite's base-url token, which the build substitutes, so
      a subpath deployment (VITE_BASE_PATH) points at its own copies rather than the origin root's.
      The manifest itself needs no such token: every path in it is relative, so it resolves against
      wherever the manifest is being served from.
    -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <!--
      The tab icon: the mark alone, as a vector, so it stays sharp at 16px and follows the system
      theme. Listed after the PNG so a browser that reads SVG icons takes it; one that does not
      keeps the PNG.
    -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- iOS reads none of the manifest's icons; this is the one it takes. -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ECMS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      The installed window's title bar. Two of them, media-scoped, because the app itself follows
      the system theme — a single light bar over the dark shell reads as a different application.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#4f46e5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#312e81" />
    <!--
      What a link preview says — a recruitment link posted on WhatsApp or a job board, a contract
      verification link. One document serves every route, so it names the company, not a screen.
    -->
    <meta
      name="description"
      content="إيجي كاش للحلول النقدية — EGYCASH, Technological Cash Solutions."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EGYCASH" />
    <meta property="og:title" content="EGYCASH" />
    <meta
      property="og:description"
      content="إيجي كاش للحلول النقدية — EGYCASH, Technological Cash Solutions."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
