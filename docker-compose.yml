# Local development stack (Review R32).
# MongoDB runs as a single-node replica set — transactions require it (ADR-005).
services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: |
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 30s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  # Local email preview — the notifications service (phase 2.2) is untestable locally without it.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025' # web UI
      - '1025:1025' # SMTP

  # Virus scanning for uploads (Security Architecture §3). Opt-in — `--profile antivirus` — and
  # paired with CLAMAV_HOST=localhost in .env. The signature database downloads on first start
  # (a few minutes); until then the api logs "clamd is not answering" and holds uploads at
  # `pending`, which is the intended behaviour, not a fault.
  clamav:
    image: clamav/clamav:stable
    profiles: ['antivirus']
    ports:
      - '3310:3310'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 20

  # Offline National-ID OCR sidecar (OQ-30). Opt-in — `--profile ocr` — and paired with
  # NATIONAL_ID_OCR_URL=http://localhost:8099 in .env. Without that variable the api keeps the
  # null stub and the endpoint answers `available: false`, which is every install that does not
  # run this.
  #
  #   docker compose --profile ocr up -d --build nid-ocr
  #
  # `target: runtime` is the PaddleOCR-only stage. The Dockerfile also carries `paddleocr-vl` and
  # `qwen` stages that bake far larger VLM weights; naming the stage here keeps a plain
  # `--build` from depending on which stage happens to be last.
  #
  # The weights are baked into the image, so the container needs no egress at all. The first
  # build is long (it downloads and bakes the models) and the image is several GB. The port is
  # bound to loopback deliberately: it reads identity cards and must never be reachable off the
  # host.
  nid-ocr:
    build:
      context: ./spikes/national-id-ocr
      target: runtime
    profiles: ['ocr']
    ports:
      - '127.0.0.1:8099:8099'
    environment:
      OCR_PORT: '8099'
      OCR_PRELOAD: '1' # pay the model load at start, not on a user's first request

volumes:
  mongo-data:
  redis-data:
  clamav-data:
