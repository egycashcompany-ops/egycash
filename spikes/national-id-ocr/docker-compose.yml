# Runs the OCR service. Models are inside the image, so it needs no network.
services:
  nid-ocr:
    build: .
    image: ecms/nid-ocr:latest
    restart: unless-stopped
    environment:
      OCR_PORT: "8099"
      OCR_PRELOAD: "1" # load the models at start
      OCR_WORKERS: "3" # one Paddle process per reader, so the three run at once (see pool.py)
      # To use your own field positions, mount a profile and set:
      # OCR_LAYOUT_PROFILE: /profiles/egypt-2027.json
    # volumes:
    #   - ./profiles:/profiles:ro
    ports:
      - "127.0.0.1:8099:8099" # this computer only
      - "[::1]:8099:8099" # and its IPv6 loopback: "localhost" can resolve to ::1 on Windows
    networks: [ecms]

  # Accuracy measurement on local cards, with networking disabled.
  nid-ocr-bench:
    profiles: [bench]
    image: ecms/nid-ocr:latest
    network_mode: none
    volumes:
      - ./fixtures/real:/app/fixtures/real:ro # local test cards, not part of the image
    command: ["bench/measure.py", "--fixtures", "fixtures/real", "--recognizer", "paddle"]

networks:
  ecms:
    driver: bridge
