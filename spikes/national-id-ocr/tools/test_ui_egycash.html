<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>EGY CASH · ID reader</title>
<script>if (location.search.includes("poster")) document.documentElement.classList.add("poster");</script>
<style>
  /* EGY CASH ID reader, for HR's internal use. Kept deliberately quiet: one neutral dark, white
     type, and a single accent taken from the logo's indigo. Motion does the talking (the frame's
     travelling light, the card being scanned), and all of it stops under prefers-reduced-motion. */
  :root {
    --bg: #09090f; --surface: #111119; --surface-2: #181822; --line: rgb(255 255 255 / 0.08);
    --text: #f4f4f7; --muted: #9b9bab; --accent: #7d7cf2; --accent-soft: #a9a8ff;
    --ok: #5ad597; --ok-bg: rgb(90 213 151 / 0.12); --mid: #b4b3ff; --mid-bg: rgb(125 124 242 / 0.18);
    --bad: #ff8f86; --bad-bg: rgb(255 143 134 / 0.12);
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, Tahoma, sans-serif;
    --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); scroll-behavior: smooth; }
  body { margin: 0; color: var(--text); background: var(--bg); font: 15px/1.5 var(--sans); }
  :focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 3px; }
  a { color: inherit; }

  /* ── Hero ─────────────────────────────────────────────────────────────── */
  .hero { position: relative; isolation: isolate; overflow: hidden; margin: 14px; border-radius: 24px;
          background: radial-gradient(70% 90% at 75% 50%, rgb(125 124 242 / 0.14), transparent 70%), var(--surface); }
  /* The hairline frame, with a light that travels round it. */
  .frame { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); pointer-events: none; overflow: visible; }
  .frame rect { fill: none; vector-effect: non-scaling-stroke; }
  .frame .base { stroke: rgb(255 255 255 / 0.10); stroke-width: 1; }
  .frame .run { stroke: url(#run-grad); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 140 860;
                animation: run 7s linear infinite; filter: drop-shadow(0 0 6px rgb(169 168 255 / 0.9)); }
  .frame .run.two { animation-delay: -3.5s; opacity: .55; }
  @keyframes run { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 28px 36px 0; }
  .lockup { display: flex; align-items: center; gap: 10px; text-decoration: none; border-radius: 6px; }
  .lockup img { display: block; height: 26px; width: auto; }
  .lockup .lockup-word { height: 15px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 7px 12px; border-radius: 999px;
          border: 1px solid var(--line); background: rgb(0 0 0 / 0.25); color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill[data-state="ok"] .dot { background: var(--ok); animation: pulse 2.4s ease-out infinite; }
  .pill[data-state="down"] .dot { background: var(--bad); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgb(90 213 151 / 0.6); } 100% { box-shadow: 0 0 0 9px rgb(90 213 151 / 0); } }

  .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 40px; align-items: center;
               padding: 24px 36px 48px; min-height: min(600px, 74vh); }
  .mark { display: block; height: clamp(96px, 11vw, 150px); width: auto; margin-bottom: 34px;
          animation: rise .9s cubic-bezier(.16,1,.3,1) both; filter: drop-shadow(0 16px 30px rgb(0 0 0 / 0.5)); }
  h1 { font: 600 clamp(40px, 5vw, 68px)/1.02 var(--display); letter-spacing: -0.03em; margin: 0 0 30px;
       animation: rise .9s .12s cubic-bezier(.16,1,.3,1) both; }
  h1 span { display: block; color: var(--muted); }
  .start { animation: rise .9s .24s cubic-bezier(.16,1,.3,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  .btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
         min-height: 48px; padding: 12px 22px; border-radius: 12px; font: 600 16px/1 var(--sans); text-decoration: none;
         background: var(--text); color: #0b0b12; border: 0; cursor: pointer; transition: transform .2s; }
  .btn:hover { transform: translateY(-2px); }
  .btn::after { content: ""; position: absolute; inset: 0; transform: translateX(-120%);
                background: linear-gradient(100deg, transparent 30%, rgb(125 124 242 / 0.35) 50%, transparent 70%);
                animation: shine 3.5s 1.2s ease-in-out infinite; }
  @keyframes shine { 0%, 60% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
  .btn .arrow { transition: transform .2s; } .btn:hover .arrow { transform: translateX(3px); }

  /* The hero picture: a real-time 3D model of the company's silver van, driving forward with its
     light bar flashing (three.js, loaded from a CDN). Until it starts, or if WebGL or the network is
     missing, the drawn SVG van shows in its place. */
  .stage { position: relative; justify-self: center; width: min(100%, 680px); aspect-ratio: 100 / 78; animation: arrive 1.4s cubic-bezier(.16,1,.3,1) both; }
  .stage .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .7s ease;
                   -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 65%, transparent 100%);
                   mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 65%, transparent 100%); }
  .stage.is-3d .poster { opacity: 0; }
  @keyframes arrive { from { transform: translateY(16px); opacity: 0; } }
  .stage canvas { display: none; position: absolute; inset: 0; width: 100%; height: 100%;
                  -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 65%, transparent 100%);
                  mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 65%, transparent 100%); }
  .stage.is-3d canvas { display: block; animation: fade-in .8s ease both; }
  .stage .fallback { display: none; }
  .stage.no3d:not(.is-3d) .fallback { display: block; position: absolute; inset: 0; }
  .stage.no3d:not(.is-3d) .poster { display: none; }
  /* ?poster renders just the van, on a transparent page, to make the still above. */
  html.poster, html.poster body { background: transparent; }
  html.poster body > :not(header), html.poster .hero > :not(.hero-grid), html.poster .hero-grid > :not(.stage) { display: none !important; }
  html.poster .hero { margin: 0; border: 0; background: none; border-radius: 0; }
  html.poster .hero::after { display: none; }
  html.poster .hero-grid { display: block; padding: 0; min-height: 0; }
  html.poster .stage { width: 680px; animation: none; }
  html.poster .stage .poster { display: none; }
  @keyframes fade-in { from { opacity: 0; } }
  .stage .src { display: none; }
  .van { display: block; width: 80%; margin: 0 auto; height: auto; }
  .van .leds-a { animation: flash-a .9s step-end infinite; }
  .van .leds-b { animation: flash-b .9s step-end infinite; }
  @keyframes flash-a { 0% { opacity: 1; } 18% { opacity: .15; } 24% { opacity: 1; } 44% { opacity: .15; } }
  @keyframes flash-b { 0% { opacity: .15; } 50% { opacity: 1; } 68% { opacity: .15; } 74% { opacity: 1; } 94% { opacity: .15; } }

  @media (max-width: 900px) {
    .hero-grid { grid-template-columns: minmax(0, 1fr); min-height: 0; padding-bottom: 60px; }
    .mark { margin-bottom: 24px; }
  }
  @media (max-width: 560px) {
    .hero { margin: 8px; border-radius: 18px; }
    .topbar { padding: 22px 22px 0; } .hero-grid { padding: 20px 22px 56px; gap: 34px; }
  }

  /* ── Reader ───────────────────────────────────────────────────────────── */
  main { max-width: 1080px; margin: 0 auto; padding: 40px 18px 64px; scroll-margin-top: 12px; }
  .reader-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .reader-head h2 { font: 600 26px/1.15 var(--display); letter-spacing: -0.015em; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  .tab { border: 0; border-radius: 9px; padding: 8px 14px; min-height: 38px; font: inherit; background: none; color: var(--muted); cursor: pointer; }
  .tab:hover { color: var(--text); background: none; }
  .tab[aria-selected="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }

  .stepper { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); list-style: none; margin: 0 0 20px; padding: 0; counter-reset: s; }
  .stepper::before { content: ""; position: absolute; left: 12%; right: 12%; top: 15px; height: 2px; background: var(--line); }
  .stepper::after { content: ""; position: absolute; left: 12%; top: 15px; height: 2px; width: calc(76% * var(--p, 0));
                    background: var(--accent); transition: width .5s cubic-bezier(.16,1,.3,1); }
  .stepper li { position: relative; z-index: 1; counter-increment: s; display: grid; justify-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .stepper li::before { content: counter(s); display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%;
                        background: var(--surface); border: 2px solid rgb(255 255 255 / 0.18); font-weight: 600; transition: all .3s; }
  .stepper li[data-state="current"] { color: var(--text); }
  .stepper li[data-state="current"]::before { border-color: var(--accent); color: var(--accent-soft); box-shadow: 0 0 0 5px rgb(125 124 242 / 0.18); }
  .stepper li[data-state="done"] { color: var(--text); }
  .stepper li[data-state="done"]::before { content: "✓"; background: var(--accent); border-color: var(--accent); color: #fff; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .sides, .result { grid-template-columns: 1fr !important; } }
  .side { transition: border-color .3s, box-shadow .3s; }
  .side.active { border-color: rgb(125 124 242 / 0.6); box-shadow: 0 0 0 3px rgb(125 124 242 / 0.14); }
  .side h3 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .side h3 .ok { color: var(--ok); opacity: 0; transform: scale(.5); transition: all .3s cubic-bezier(.34,1.56,.64,1); }
  .side.done h3 .ok { opacity: 1; transform: none; }
  .preview { position: relative; aspect-ratio: 85.6 / 54; border-radius: 12px; display: grid; place-items: center; overflow: hidden;
             margin: 0 0 12px; background: #06060b; color: var(--muted); font-size: 14px; }
  .preview:not(.has-photo)::before { content: ""; position: absolute; inset: 13%; border-radius: 12px;
      --c: rgb(169 168 255 / 0.85);
      background:
        linear-gradient(var(--c), var(--c)) top left / 24px 2px, linear-gradient(var(--c), var(--c)) top left / 2px 24px,
        linear-gradient(var(--c), var(--c)) top right / 24px 2px, linear-gradient(var(--c), var(--c)) top right / 2px 24px,
        linear-gradient(var(--c), var(--c)) bottom left / 24px 2px, linear-gradient(var(--c), var(--c)) bottom left / 2px 24px,
        linear-gradient(var(--c), var(--c)) bottom right / 24px 2px, linear-gradient(var(--c), var(--c)) bottom right / 2px 24px;
      background-repeat: no-repeat; animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { inset: 16%; opacity: .6; } }
  .preview .ghost { width: 22%; opacity: .1; }
  .preview.has-photo img { animation: pop .45s cubic-bezier(.16,1,.3,1); }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } }
  .preview img, .preview video { width: 100%; height: 100%; object-fit: contain; }
  .preview.reading::after { content: ""; position: absolute; left: 0; right: 0; height: 30%; top: -30%;
      background: linear-gradient(180deg, transparent, rgb(125 124 242 / 0.22) 75%, rgb(169 168 255 / 0.95) 98%, transparent);
      animation: scan 2.2s cubic-bezier(.45,.05,.55,.95) infinite; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, .filebtn { font: inherit; border-radius: 10px; padding: 9px 14px; min-height: 40px; cursor: pointer;
                     border: 1px solid rgb(255 255 255 / 0.14); background: rgb(255 255 255 / 0.04); color: var(--text);
                     display: inline-flex; align-items: center; gap: 6px; transition: background .15s, transform .15s; }
  button:hover, .filebtn:hover { background: rgb(255 255 255 / 0.09); }
  button:active, .filebtn:active { transform: scale(.97); }
  .filebtn { position: relative; }
  .filebtn:focus-within { outline: 2px solid var(--accent-soft); outline-offset: 3px; }
  /* Hidden visually but still focusable, so the pickers work from the keyboard. */
  .filebtn input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  button.primary { background: var(--text); color: #0b0b12; border-color: var(--text); font-weight: 700; padding: 10px 22px; }
  button.primary:hover { background: #fff; }
  button:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .actions { margin: 16px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .status { color: var(--muted); flex: 1 1 240px; }
  .status.error { color: var(--bad); }
  .result { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
  .result .panel { animation: rise .5s cubic-bezier(.16,1,.3,1) both; }
  .result .panel + .panel { animation-delay: .08s; }
  .summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
  .field { margin-bottom: 10px; animation: rise .45s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--i) * 45ms); }
  .field label { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .field input { width: 100%; font: inherit; font-size: 16px; padding: 9px 11px; border-radius: 10px;
                 border: 1px solid rgb(255 255 255 / 0.12); background: #06060b; color: var(--text); }
  .field.flag input { border-color: rgb(125 124 242 / 0.7); }
  .field.flag.low input { border-color: rgb(255 143 134 / 0.6); }
  .field input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgb(125 124 242 / 0.25); }
  .field input[dir="rtl"] { font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", sans-serif; }
  .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.high { color: var(--ok); background: var(--ok-bg); }
  .badge.medium { color: var(--mid); background: var(--mid-bg); }
  .badge.low, .badge.none { color: var(--bad); background: var(--bad-bg); }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--muted); }
  .note { font-size: 13px; color: var(--muted); }
  .hidden { display: none !important; }
  .cam { margin-top: 16px; }
  select { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  textarea { width: 100%; min-height: 220px; font: inherit; font-size: 16px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #06060b; color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num { text-align: right; color: var(--muted); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    *, ::before, ::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    .frame .run { display: none; }
  }
</style>
</head>

      <linearGradient id="run-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a9a8ff"/>
      </linearGradient>
    </defs>
    <rect class="base" x="0" y="0" width="100%" height="100%" rx="16"/>
    <rect class="run" x="0" y="0" width="100%" height="100%" rx="16" pathLength="1000"/>
    <rect class="run two" x="0" y="0" width="100%" height="100%" rx="16" pathLength="1000"/>

<main id="tool">
  <div class="reader-head">
    <h2 id="reader-title">Scan a card</h2>
    <div class="tabs" role="tablist" aria-label="What to read">
      <button type="button" class="tab" data-mode="id" role="tab" aria-selected="true" aria-controls="mode-id" id="tab-id">National ID Card</button>
      <button type="button" class="tab" data-mode="badge" role="tab" aria-selected="false" aria-controls="mode-badge" id="tab-badge">EGY CASH ID</button>
      <button type="button" class="tab" data-mode="doc" role="tab" aria-selected="false" aria-controls="mode-doc" id="tab-doc">Any document</button>
      <a class="tab" href="/readers">All three readers →</a>
    </div>
  </div>

  <div id="mode-id" role="tabpanel" aria-labelledby="tab-id">
  <ol class="stepper" id="stepper" aria-label="Progress">
    <li id="st-front">Front</li>
    <li id="st-back">Back</li>
    <li id="st-read">Read</li>
    <li id="st-check">Check</li>
  </ol>
  <section class="sides">
    <div class="panel side active" id="side-front">
      <h3>Front <span class="ok" aria-hidden="true">✓</span></h3>
      <div class="preview" id="preview-front"></div>
      <div class="row">
        <button type="button" data-camera="front">Camera</button>
        <label class="filebtn">Take photo
          <input type="file" accept="image/*" capture="environment" data-file="front"></label>
        <label class="filebtn">Upload
          <input type="file" accept="image/*" data-file="front"></label>
        <button type="button" data-clear="front" class="hidden">Retake</button>
      </div>
    </div>
    <div class="panel side" id="side-back">
      <h3>Back <span class="ok" aria-hidden="true">✓</span></h3>
      <div class="preview" id="preview-back"></div>
      <div class="row">
        <button type="button" data-camera="back">Camera</button>
        <label class="filebtn">Take photo
          <input type="file" accept="image/*" capture="environment" data-file="back"></label>
        <label class="filebtn">Upload
          <input type="file" accept="image/*" data-file="back"></label>
        <button type="button" data-clear="back" class="hidden">Retake</button>
      </div>
    </div>
  </section>

  <div class="actions">
    <button type="button" class="primary" id="read" disabled>Read card</button>
    <button type="button" id="cancel" class="hidden">Cancel</button>
    <button type="button" id="reset">Start over</button>
    <span class="status" id="status" role="status" aria-live="polite">Connecting…</span>
  </div>

  <section class="result hidden" id="result">
    <div class="panel">
      <div id="portrait-box" class="hidden" style="display:flex;gap:14px;align-items:center;margin-bottom:16px">
        <img id="portrait" alt="Holder's photo from the card" style="width:96px;border-radius:10px;border:1px solid var(--line)">
        <a id="portrait-download" download="card-photo.jpg"><button type="button" tabindex="-1">Download photo</button></a>
      </div>
      <div id="fields"></div>
    </div>
    <div class="panel">
      <dl id="derived"></dl>
      <details id="oriented" class="hidden">
        <summary>Card as read</summary>
        <div id="oriented-sides" style="display:grid;gap:10px;margin-top:10px"></div>
      </details>
    </div>
  </section>
  </div>

  <div id="mode-badge" class="hidden" role="tabpanel" aria-labelledby="tab-badge">
    <div class="panel">
      <div class="preview" id="preview-badge"></div>
      <div class="row">
        <button type="button" data-camera="badge">Camera</button>
        <label class="filebtn">Take photo
          <input type="file" accept="image/*" capture="environment" data-file="badge"></label>
        <label class="filebtn">Upload
          <input type="file" accept="image/*" data-file="badge"></label>
        <button type="button" class="primary" id="read-badge" disabled>Read EGY CASH ID</button>
        <span class="status" id="status-badge" role="status" aria-live="polite"></span>
      </div>
    </div>
    <section class="result hidden" id="result-badge" style="margin-top:16px">
      <div class="panel">
        <div id="badge-check" class="summary" role="status"></div>

function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle("error", isError);
}

function setSteps() {
  const st = (id, state) => { const el = $(id); if (state) el.dataset.state = state; else delete el.dataset.state; };
  st("st-front", photos.front ? "done" : "current");
  st("st-back", photos.back ? "done" : photos.front ? "current" : null);
  st("st-read", readDone ? "done" : reader !== null || (photos.front && photos.back) ? "current" : null);
  st("st-check", readDone ? "current" : null);
  const progress = readDone ? 1 : (photos.front && photos.back) ? 2 / 3 : photos.front || photos.back ? 1 / 3 : 0;
  $("stepper").style.setProperty("--p", progress);
}

// What is shown is a small copy of each photo: a full-size one is megabytes to decode, and a
// phone gave up on large ones, leaving the box empty. The full photo is still what is read.
const thumbs = {}, thumbFor = {};
function shown(key) {
  const url = photos[key];
  if (url && thumbFor[key] !== url) {
    thumbFor[key] = url;
    thumbs[key] = null;
    CaptureGuide.thumbnail(url).then((small) => {
      if (thumbFor[key] === photos[key]) { thumbs[key] = small; refresh(); }
    }).catch(() => {});
  }
  return url ? (thumbs[key] || url) : null;
}

function refresh() {
  $("preview-doc").innerHTML = photos.doc ? `<img alt="document" src="${shown("doc")}">` : GHOST;
  $("preview-doc").classList.toggle("has-photo", !!photos.doc);
  $("read-doc").disabled = !photos.doc;
  $("preview-badge").innerHTML = photos.badge ? `<img alt="badge" src="${shown("badge")}">` : GHOST;
  $("preview-badge").classList.toggle("has-photo", !!photos.badge);
  $("read-badge").disabled = !photos.badge;
  for (const side of ["front", "back"]) {
    const box = $("preview-" + side);
    box.innerHTML = photos[side] ? `<img alt="${side} of the card" src="${shown(side)}">` : GHOST;
    box.classList.toggle("has-photo", !!photos[side]);
    $("side-" + side).classList.toggle("done", !!photos[side]);
    document.querySelector(`[data-clear="${side}"]`).classList.toggle("hidden", !photos[side]);
  }
  const next = !photos.front ? "front" : !photos.back ? "back" : null;
  $("side-front").classList.toggle("active", next === "front");
  $("side-back").classList.toggle("active", next === "back");
  $("read").disabled = !(photos.front || photos.back) || reader !== null;
  setSteps();
}

// Downscale and re-encode in the browser: phone photos are 4-12 MB, and two of them base64-encoded
// would exceed the service's request limit.
function toJpeg(source, width, height) {
  const photo = CaptureGuide.encodePhoto(source, width, height);
  lastSize = `${photo.width}×${photo.height}`;
  return photo.url;
}

async function fromFile(file) {
  const photo = await CaptureGuide.photoFromFile(file);
  lastSize = `${photo.width}×${photo.height}`;
  if (photo.reduced) setStatus("That photo was very large, so it was reduced to fit.");
  return photo.url;
}

function afterPhoto(side) {
  if (side === "doc" || side === "badge") return;
  readDone = false;
  setStatus(photos.front && photos.back ? "Ready to read." : photos.front ? "Now the back." : "Now the front.");
}

// The live camera only works on https or on this PC; on a phone over the Wi-Fi link, "Take photo"
// opens the phone's own camera instead, so the live button is hidden there rather than failing.
if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
  document.querySelectorAll("[data-camera]").forEach((button) => button.classList.add("hidden"));
}

document.querySelectorAll("[data-file]").forEach((input) => {
  input.addEventListener("change", async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      photos[input.dataset.file] = await fromFile(file);
      afterPhoto(input.dataset.file);
      refresh();
    } catch (error) {
      setStatus("Could not open that image.", true);
    }
    input.value = "";
  });
});

document.querySelectorAll("[data-clear]").forEach((button) => {
  button.addEventListener("click", () => { photos[button.dataset.clear] = null; readDone = false; refresh(); });
});

// The camera is the main rear lens, chosen by name when the phone lists several (see
// CaptureGuide.mainRearCamera); there is no list to pick from. Once found it is remembered.
let rearCamera = null;
async function openStream(deviceId) {
  const video = deviceId ? { deviceId: { exact: deviceId }, width: { ideal: 1920 } }
                         : { facingMode: "environment", width: { ideal: 1920 } };
  return navigator.mediaDevices.getUserMedia({ video, audio: false });
}

async function openCamera(side) {
  cameraFor = side;
  $("camera-title").textContent = { front: "Front", back: "Back", doc: "Document", badge: "EGY CASH ID" }[side];
  stopCamera();
  try {
    try {
      stream = await openStream(rearCamera);
    } catch (error) {
      if (!rearCamera) throw error;
      rearCamera = null; // that camera is gone (the phone renumbers them): the default one
      stream = await openStream(null);
    }
    if (!rearCamera && window.CaptureGuide) {
      // Names are known now the camera is allowed: if the default is not the main lens, switch.
      const devices = await navigator.mediaDevices.enumerateDevices();
      const main = CaptureGuide.mainRearCamera(devices);
      const current = stream.getVideoTracks()[0].getSettings().deviceId;
      rearCamera = main ? main.deviceId : current;
      if (main && main.deviceId !== current) {
        try {
          const better = await openStream(main.deviceId);
          stream.getTracks().forEach((track) => track.stop());
          stream = better;
        } catch (error) { /* keep the default one */ }
      }
    }
  } catch (error) {
    setStatus("Camera unavailable. Use Take photo or Upload.", true);
    return;
  }
  $("video").srcObject = stream;
  startGuide(side);
  $("camera").classList.remove("hidden");
  $("camera-select").classList.add("hidden");
  $("camera").scrollIntoView({ block: "nearest" });
}

// The capture guide (capture_guide.js): a card-shaped frame over the camera, telling the person
// what to fix (closer, steadier, less glare) and capturing by itself once the card is framed well.
let guide = null;
function startGuide(side) {
  if (!window.CaptureGuide || side === "doc") return;
  guide = guide || CaptureGuide.attach($("video"), { side: () => cameraFor, onCapture: () => $("snap").click() });
  // The back follows the front with the front still in view: the guide knows the card it took.
  guide.start();
}
// With the card in the frame, only the frame and a margin are sent: the reader then never has to
// look for the card among the face, the hand and the table.
function framedShot(video) {
  const state = guide && cameraFor !== "doc" ? guide.state : null;
  return state && state.card ? guide.capture() : toJpeg(video, video.videoWidth, video.videoHeight);
}

function stopCamera() {
  if (guide) guide.stop();
  if (stream) stream.getTracks().forEach((track) => track.stop());
  stream = null;
}

document.querySelectorAll("[data-camera]").forEach((button) => {
  button.addEventListener("click", () => openCamera(button.dataset.camera));
});
$("cam-cancel").addEventListener("click", () => { stopCamera(); $("camera").classList.add("hidden"); });
$("snap").addEventListener("click", () => {
  const video = $("video");
  if (!video.videoWidth) return;
  const side = cameraFor;
  const firstTime = !photos[side];
  photos[side] = framedShot(video);
  // Front done: go straight on to the back, which is the order the card is handled in, on the same
  // camera: closing it and opening it again cost the back a second or more (the phone restarts the
  // camera, then focuses and sets the exposure again), and was why the back was slow.
  // (Not on a retake of the front: that is the person redoing one photo, not starting the pair.)
  const keepOpen = side === "front" && firstTime && !photos.back && stream;
  if (keepOpen) {
    cameraFor = "back";
    $("camera-title").textContent = "Back";
    startGuide("back");
  } else {
    stopCamera();
    $("camera").classList.add("hidden");
  }
  afterPhoto(side);
  refresh();
});

$("reset").addEventListener("click", () => {
  if (reader) reader.abort();
  photos.front = photos.back = null;
  readDone = false;
  $("result").classList.add("hidden");
  refresh();
  setStatus(serviceReady ? "Ready." : statusEl.textContent);
});

const base64Of = (dataUrl) => dataUrl.slice(dataUrl.indexOf(",") + 1);
const escapeHtml = (text) => String(text ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function setReading(on) {
  for (const side of ["front", "back"]) $("preview-" + side).classList.toggle("reading", on && !!photos[side]);
  $("cancel").classList.toggle("hidden", !on);
}

$("cancel").addEventListener("click", () => reader?.abort());

$("read").addEventListener("click", async () => {
  reader = new AbortController();
  readDone = false;
  $("result").classList.add("hidden");
  refresh();
  setReading(true);
  const started = performance.now();
  setStatus("Reading…");
  // The elapsed time is shown, but announced only at the start and the end, not every second.
  const timer = setInterval(() => {
    statusEl.setAttribute("aria-live", "off");
    const s = (performance.now() - started) / 1000;
    setStatus(s > 30 ? `Still reading… ${s.toFixed(0)} s` : `Reading… ${s.toFixed(0)} s`);
  }, 1000);
  try {
    const response = await fetch("/api/extract", {
      method: "POST",
      headers: { "content-type": "application/json" },
      signal: reader.signal,
      body: JSON.stringify({
        // Either side alone is allowed: the service reads whatever it is given.
        frontImageBase64: photos.front ? base64Of(photos.front) : undefined,
        backImageBase64: photos.back ? base64Of(photos.back) : undefined,
        returnOrientedImages: true,
        returnPortrait: true,
      }),
    });
    const body = await response.json().catch(() => ({ error: "Unexpected reply from the service." }));
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    clearInterval(timer);
    statusEl.setAttribute("aria-live", "polite");
    readDone = true;
    render(body, ((body.elapsedMs ?? performance.now() - started) / 1000).toFixed(1));
  } catch (error) {
    clearInterval(timer);
    statusEl.setAttribute("aria-live", "polite");
    setStatus(error.name === "AbortError" ? "Cancelled." : "Failed: " + error.message, error.name !== "AbortError");
  } finally {
    reader = null;
    setReading(false);
    refresh();
  }
});

function render(body, seconds) {
  const fields = body.fields || {};
  const scores = body.scores || {};
  const ICON = { high: "✓", medium: "!", low: "✕", none: "✕" };
  const WORD = { high: "", medium: "check", low: "review", none: "not read" };
  let toCheck = 0;
  $("fields").innerHTML = FIELDS.map(([key, label, dir], i) => {
    const field = fields[key] || {};
    const confidence = field.confidence || "none";
    const flag = confidence !== "high";
    if (flag) toCheck += 1;
    const pct = key in scores ? ` ${scores[key]}%` : "";
    const word = WORD[confidence] ? ` ${WORD[confidence]}` : "";
    return `<div class="field${flag ? " flag" : ""}${confidence === "low" || confidence === "none" ? " low" : ""}" style="--i:${i}">
      <label for="f-${key}">${label} <span class="badge ${confidence}">${ICON[confidence]}${pct}${word}</span></label>
      <input id="f-${key}" dir="${dir}"${dir === "rtl" ? ' lang="ar"' : ""} value="${escapeHtml(field.value || "")}">
    </div>`;
  }).join("");
  if (toCheck) {
    $("fields").insertAdjacentHTML("afterbegin",
      `<div class="summary"><span>${toCheck} to check</span><button type="button" id="next-flag">Next to check</button></div>`);
    $("next-flag").addEventListener("click", () => {
      const flagged = [...document.querySelectorAll(".field.flag input")];
      const at = flagged.indexOf(document.activeElement);
      flagged[(at + 1) % flagged.length]?.focus();
    });
  }
  const idInput = $("f-nationalId");
  idInput.addEventListener("input", () => renderDerived(idInput.value));
  renderDerived(idInput.value);

  if (body.portraitImage) {
    const src = `data:image/jpeg;base64,${body.portraitImage}`;
    $("portrait").src = src;
    $("portrait-download").href = src;
  }
  $("portrait-box").classList.toggle("hidden", !body.portraitImage);
  const images = body.orientedImages || {};
  const diagnostics = body.diagnostics || {};
  $("oriented-sides").innerHTML = ["front", "back"].filter((side) => images[side]).map((side) => {
    // A card cut along its own edges has the card's rounded corners put back, so only its surface shows.
    const round = diagnostics[side]?.cardCorners ? ' style="border-radius:3.7% / 5.9%"' : "";
    return `<div class="preview has-photo"><img alt="${side} as read"${round} src="data:image/jpeg;base64,${images[side]}"></div>`;
  }).join("");
  $("oriented").classList.toggle("hidden", !Object.keys(images).length);

  setStatus(toCheck ? `Done in ${seconds} s · ${toCheck} to check.` : `Done in ${seconds} s · all clear.`);
  // What to change when retaking, from the actual reason (blur, glare, distance), not always "too far".
  const advice = window.CaptureGuide?.retakeAdvice(body);
  const sideNote = window.CaptureGuide?.sideNote(body);
  if (advice || sideNote) {
    const done = advice ? "" : ($("status")?.textContent || "") + " ";
    setStatus(done + [sideNote, advice?.text].filter(Boolean).join(" "), advice?.unreadable);
  }
  $("result").classList.remove("hidden");
}

function showMode(mode) {
  // The camera belongs to the mode it was opened in: left open, it stayed on screen (and on) in the
  // other one, with the other mode's label.
  const cameraMode = { front: "id", back: "id", doc: "doc", badge: "badge" }[cameraFor];
  if (!$("camera").classList.contains("hidden") && mode !== cameraMode) {
    stopCamera();
    $("camera").classList.add("hidden");
  }
  document.querySelectorAll("[data-mode]").forEach((tab) => tab.setAttribute("aria-selected", String(tab.dataset.mode === mode)));
  $("mode-id").classList.toggle("hidden", mode !== "id");
  $("mode-doc").classList.toggle("hidden", mode !== "doc");
  $("mode-badge").classList.toggle("hidden", mode !== "badge");
  $("reader-title").textContent = { id: "Scan a National ID Card", badge: "Read an EGY CASH ID", doc: "Read any document" }[mode];
}
document.querySelectorAll("[data-mode]").forEach((tab) => tab.addEventListener("click", () => showMode(tab.dataset.mode)));

const BADGE_FIELDS = [
  ["companyName", "Company", "rtl"],
  ["fullNameAr", "Name", "rtl"],
  ["jobTitle", "Job position", "rtl"],
  ["employeeCode", "Employee code", "ltr"],
  ["nationalId", "National ID", "ltr"],
];
const BADGE_VERDICT = {
  egycash_badge: "Looks like an EGY CASH ID.",
  not_egycash_badge: "This is not an EGY CASH ID: no company name, employee code or national ID number was found. Photograph the EGY CASH ID itself.",
  unsure: "Could not confirm this is an EGY CASH ID: check the fields below.",
};

$("read-badge").addEventListener("click", async () => {
  const status = $("status-badge");
  $("read-badge").disabled = true;
  status.textContent = "Reading…";
  status.classList.remove("error");
  $("preview-badge").classList.add("reading");
  try {
    const response = await fetch("/api/extract", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ documentType: "egycash_id", imageBase64: base64Of(photos.badge), returnOrientedImages: true }),
    });
    const body = await response.json().catch(() => ({ error: "Unexpected reply from the service." }));
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    const ICON = { high: "✓", medium: "!", low: "✕", none: "✕" };
    const WORD = { high: "", medium: "check", low: "review", none: "not read" };
    const fields = body.fields || {}, scores = body.scores || {}, check = body.diagnostics?.badgeCheck;
    let toCheck = 0;
    $("badge-fields").innerHTML = BADGE_FIELDS.map(([key, label, dir], i) => {
      const field = fields[key] || {};
      const confidence = field.confidence || "none";
      if (confidence !== "high") toCheck += 1;
      const pct = key in scores ? ` ${scores[key]}%` : "";
      const word = WORD[confidence] ? ` ${WORD[confidence]}` : "";
      return `<div class="field${confidence !== "high" ? " flag" : ""}${confidence === "low" || confidence === "none" ? " low" : ""}" style="--i:${i}">
        <label for="b-${key}">${label} <span class="badge ${confidence}">${ICON[confidence]}${pct}${word}</span></label>
        <input id="b-${key}" dir="${dir}"${dir === "rtl" ? ' lang="ar"' : ""} value="${escapeHtml(field.value || "")}">
      </div>`;
    }).join("");
    const notes = [BADGE_VERDICT[check?.verdict] || ""];
    if (check && fields.employeeCode && !check.employeeCodeValid) notes.push("The employee code is not the shape of one (branch code and number, seven digits or more).");
    if (check && fields.nationalId && !check.nationalIdValid) notes.push("The national ID number is not a possible one: check its digits.");
    $("badge-check").textContent = notes.filter(Boolean).join(" ");
    const image = body.orientedImages?.front;
    if (image) $("badge-oriented-img").src = `data:image/jpeg;base64,${image}`;
    $("badge-oriented").classList.toggle("hidden", !image);
    $("result-badge").classList.remove("hidden");
    status.textContent = `Done in ${((body.elapsedMs || 0) / 1000).toFixed(1)} s${toCheck ? ` · ${toCheck} to check` : " · all clear"}.`;
  } catch (error) {
    status.textContent = "Failed: " + error.message;
    status.classList.add("error");
  } finally {
    $("preview-badge").classList.remove("reading");
    $("read-badge").disabled = !photos.badge;
  }
});

$("read-doc").addEventListener("click", async () => {
  const status = $("status-doc");
  $("read-doc").disabled = true;
  status.textContent = "Reading…";
  status.classList.remove("error");
  $("preview-doc").classList.add("reading");
  try {
    const response = await fetch("/api/read", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ imageBase64: base64Of(photos.doc), returnOrientedImages: true }),
    });
    const body = await response.json().catch(() => ({ error: "Unexpected reply from the service." }));
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    $("doc-text").value = body.text;

    $("doc-lines").innerHTML = body.lines.map((line) =>
      `<tr><td dir="auto">${escapeHtml(line.text)}</td><td class="num">${Math.round(line.score * 100)}%</td></tr>`
    ).join("");
    if (body.orientedImage) $("doc-oriented-img").src = `data:image/jpeg;base64,${body.orientedImage}`;
    $("doc-oriented").classList.toggle("hidden", !body.orientedImage);
    $("result-doc").classList.remove("hidden");
    status.textContent = `Done in ${(body.elapsedMs / 1000).toFixed(1)} s.`;
  } catch (error) {
    status.textContent = "Failed: " + error.message;
    status.classList.add("error");
  } finally {
    $("preview-doc").classList.remove("reading");
    $("read-doc").disabled = !photos.doc;
  }
});

// Mirrors packages/contracts parseNationalId, for display only.
function parseNationalId(raw) {
  const value = String(raw).trim().replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
  if (!/^\d{14}$/.test(value)) return null;
  if (value[0] !== "2" && value[0] !== "3") return null;
  const year = (value[0] === "2" ? 1900 : 2000) + Number(value.slice(1, 3));
  const month = Number(value.slice(3, 5)), day = Number(value.slice(5, 7));
  const birth = new Date(Date.UTC(year, month - 1, day));
  if (birth.getUTCFullYear() !== year || birth.getUTCMonth() !== month - 1 ||
      birth.getUTCDate() !== day || birth.getTime() > Date.now()) return null;
  const governorate = GOVERNORATES[value.slice(7, 9)];
  if (!governorate) return null;
  return { birth: birth.toISOString().slice(0, 10), governorate,
           gender: Number(value[12]) % 2 === 1 ? "Male" : "Female" };
}

function renderDerived(nationalId) {
  const parts = parseNationalId(nationalId);
  $("derived").innerHTML = parts
    ? `<dt>Birth date</dt><dd>${parts.birth}</dd><dt>Gender</dt><dd>${parts.gender}</dd>
       <dt>Born in</dt><dd>${parts.governorate}</dd>`
    : `<dt>ID number</dt><dd><span class="badge low">✕ not valid</span></dd>`;
}

function setHealth() {}

fetch("/api/health").then((r) => r.json()).then((health) => {
  if (health.status === "ok") {
    serviceReady = true;
    setStatus("Ready.");
    setHealth("ok", "Online");
  } else {
    setStatus(health.error || "The OCR service is not ready yet.", true);
    setHealth("down", "Not ready");
  }
}).catch(() => {
  setStatus("OCR service offline. Start it with make serve.", true);
  setHealth("down", "Offline");
});

refresh();

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.6/build/index.module.js"}}</script>
<script type="module">
// The hero's 3D van: the company's silver Sprinter-style cash van in EGY CASH livery, driving toward
// the viewer with its roof light bar flashing. Built from primitives (no model file), so the page
// stays a single file. If WebGL or the three.js CDN is unavailable, the drawn SVG van stays visible.
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { computeBoundsTree, acceleratedRaycast } from "three-mesh-bvh";
THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

const canvas = document.getElementById("van3d");
const stage = canvas.parentElement;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches || document.documentElement.classList.contains("poster");

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true,
  preserveDrawingBuffer: document.documentElement.classList.contains("poster") });   // poster mode reads the frame back
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;     // the van barely moves: one shadow pass is enough

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
const target = new THREE.Vector3(0.1, 1.15, 0);

// ── Lights ──
scene.add(new THREE.HemisphereLight(0x9fa6ff, 0x08080c, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(5, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 });
key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight(0x7d7cf2, 1.6);
rim.position.set(-6, 4, -5);
scene.add(rim);

// ── Ground and the road moving under the van ──
// The floor fades out to transparent at its edges, so the van sits in the page, not on a slab.
const fadeCanvas = document.createElement("canvas");
fadeCanvas.width = fadeCanvas.height = 256;

// ── Real model, when tools/van.glb is present ──
// A downloaded van model replaces the built-in one. It is turned to face +x (the bonnet is the low
// end) and scaled to the same length. Then it is dressed as a cash van: silver paint, glass only in
// the cab (everything behind the driver's door is painted over, since a cash van has a blind cargo
// box), the plate removed, the light bar on the cab roof and the livery centred on the cargo side.
// The built-in van stays hidden behind it as the fallback.
const real = new THREE.Group();
scene.add(real);
// Nothing shows until the model is in (or known missing), so the built-in van never flashes up first.
van.visible = false;
function ready() { renderer.shadowMap.needsUpdate = true; stage.classList.add("is-3d"); }
renderer.localClippingEnabled = true;
new GLTFLoader().load("/van.glb", (gltf) => {
  const model = gltf.scene;
  let box = new THREE.Box3().setFromObject(model);
  let size = box.getSize(new THREE.Vector3());
  if (size.z > size.x) model.rotation.y = Math.PI / 2;
  model.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(model); size = box.getSize(new THREE.Vector3());
  model.scale.multiplyScalar(6.3 / size.x);
  model.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(model);
  const c = box.getCenter(new THREE.Vector3());
  model.position.x -= c.x; model.position.z -= c.z; model.position.y -= box.min.y;
  model.updateMatrixWorld(true);
  // The front is the end whose tallest part is lower (the bonnet).
  box = new THREE.Box3().setFromObject(model);
  let len = box.max.x - box.min.x;
  let frontTop = 0, backTop = 0;
  model.traverse((o) => {
    if (!o.isMesh) return;
    const b = new THREE.Box3().setFromObject(o), mid = (b.min.x + b.max.x) / 2;
    if (mid > box.max.x - len * 0.12) frontTop = Math.max(frontTop, b.max.y);
    if (mid < box.min.x + len * 0.12) backTop = Math.max(backTop, b.max.y);
  });
  if (frontTop > backTop) { model.rotation.y += Math.PI; model.position.x *= -1; model.position.z *= -1; }
  model.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(model);
  len = box.max.x - box.min.x;

  // Behind this line (just aft of the driver's door) the van is a blind cargo box.
  const cabLine = box.max.x - len * 0.34;
  const keepCab = [new THREE.Plane(new THREE.Vector3(1, 0, 0), -cabLine)];
  const keepCargo = [new THREE.Plane(new THREE.Vector3(-1, 0, 0), cabLine)];
  const cabGlass = glass.clone(); cabGlass.clippingPlanes = keepCab;
  const blind = paint.clone(); blind.clippingPlanes = keepCargo; blind.side = THREE.DoubleSide;
  const trim = new THREE.MeshStandardMaterial({ color: 0x15161a, roughness: 0.5, metalness: 0.3 });

  const extra = [];
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true;
    const n = (o.material?.name || "").toLowerCase();
    o.userData.matName = n;
    if (/plate/.test(n)) { o.visible = false; return; }
    if (/carpaint|details/.test(n)) { o.material = paint; return; }
    if (/frontcolor/.test(n)) { o.material = trim; return; }
    if (/^windows$|sprinter_glass/.test(n)) {
      // Cab part keeps its glass; the cargo part becomes body panel.
      o.material = cabGlass;
      const panel = new THREE.Mesh(o.geometry, blind);
      o.parent.add(panel);
      panel.position.copy(o.position); panel.quaternion.copy(o.quaternion); panel.scale.copy(o.scale);
      extra.push(panel);
      return;
    }
    if (/interior/.test(n)) {
      o.userData.inside = true;
      const m = o.material.clone(); m.clippingPlanes = keepCab; o.material = m;
    }
  });
  real.add(model);
  model.updateMatrixWorld(true);

  // Find the real body surface by casting rays at it, so the livery and light bar sit on the panels
  // and not on the mirrors' bounding box.
  const meshes = [];
  model.traverse((o) => { if (o.isMesh && o.visible && !o.userData.inside) { o.geometry.computeBoundsTree(); meshes.push(o); } });
  const ray = new THREE.Raycaster();
  ray.firstHitOnly = true;
  const hit = (from, dir) => { ray.set(from, dir); const h = ray.intersectObjects(meshes, false)[0]; return h ? h.point : null; };

  // Trim whatever sits on top of the roof (the vent dome at the back, the aerial): everything of
  // the model above the roof skin is clipped away. The light bar is added separately, so it stays.
  {
    const ys = [];
    for (let x = box.min.x + 0.5; x < box.max.x - 1.2; x += 0.1) {
      const q = hit(new THREE.Vector3(x, 10, 0.35), new THREE.Vector3(0, -1, 0));
      if (q) ys.push(q.y);
    }
    ys.sort((a, b) => a - b);
    const roofLevel = ys.length ? ys[Math.floor(ys.length * 0.5)] + 0.02 : box.max.y;
    const roofClip = new THREE.Plane(new THREE.Vector3(0, -1, 0), roofLevel);
    const seen = new Set();
    model.traverse((o) => {
      if (!o.isMesh) return;
      for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
        if (seen.has(m)) continue;
        seen.add(m);
        m.clippingPlanes = [...(m.clippingPlanes || []), roofClip];
      }
    });
  }

  // ── Blind cargo sides ──
  // A cash van has no windows behind the cab. Each side gets a skin over the window band that
  // follows the body's own curve: a grid whose points are cast onto the real surface (glass
  // included), painted with the very same paint as the body, so it reads as plain panel.
  const H = box.max.y - box.min.y;
  const yAt = (f) => box.min.y + H * f;
  const skinX0 = box.min.x + 0.42, skinX1 = cabLine - 0.03;   // clear of the rounded rear corner
  const skinY0 = yAt(0.37), skinY1 = yAt(0.88);
  makeSkin(skinX0, skinX1, skinY0, skinY1, 48, 18, true);
  makeSkin(cabLine - 0.8, cabLine + 0.07, yAt(0.35), yAt(0.53), 16, 8, false);
  function makeSkin(skinX0, skinX1, skinY0, skinY1, NX, NY, main) {
  for (const s of [1, -1]) {
    const zs = [];
    for (let j = 0; j <= NY; j++) {
      const row = [];
      for (let i = 0; i <= NX; i++) {
        const x = skinX0 + (skinX1 - skinX0) * (i / NX), y = skinY0 + (skinY1 - skinY0) * (j / NY);
        const q = hit(new THREE.Vector3(x, y, s * 10), new THREE.Vector3(0, 0, -s));
        row.push(q ? Math.abs(q.z) : null);
      }
      // A ray that went through an opening lands deep inside: it is a dip with surface on both
      // sides. Fill dips from their neighbours; the rounded rear corner is not a dip, so it stays.
      const fixed = row.map((z, i) => {
        const left = Math.max(0, ...row.slice(0, i).filter((v) => v !== null));
        const right = Math.max(0, ...row.slice(i + 1).filter((v) => v !== null));
        const rim = Math.min(left, right);
        return z === null || (rim > 0 && z < rim - 0.04) ? (rim > 0 ? rim : Math.max(left, right)) : z;
      });
      zs.push(fixed);
    }
    // Smooth the grid so the paint reflects like a pressed panel, not a hammered one.
    for (let pass = 0; pass < 3; pass++) {
      const copy = zs.map((r) => r.slice());
      for (let j = 0; j <= NY; j++) for (let i = 1; i < NX; i++) {
        const js = [Math.max(0, j - 1), j, Math.min(NY, j + 1)];
        let sum = 0;
        for (const jj of js) sum += copy[jj][i - 1] + copy[jj][i] + copy[jj][i + 1];
        zs[j][i] = sum / 9;
      }
    }
    const geo = new THREE.PlaneGeometry(skinX1 - skinX0, skinY1 - skinY0, NX, NY);
    const pos = geo.attributes.position;
    for (let k = 0; k < pos.count; k++) {
      const i = k % (NX + 1), j = NY - Math.floor(k / (NX + 1));   // plane rows run top to bottom
      pos.setXYZ(k, skinX0 + (skinX1 - skinX0) * (i / NX), skinY0 + (skinY1 - skinY0) * (j / NY), s * (zs[j][i] + 0.004));
    }
    if (s < 0) geo.index.array.reverse();       // keep the outer face outward on the far side
    geo.computeVertexNormals();
    const skin = new THREE.Mesh(geo, paint);
    real.add(skin);
    if (main) {
      real.userData["side" + s] = zs[Math.round(NY * 0.5)][Math.round(NX * 0.5)] + 0.004;
      real.userData["skin" + s] = { zs, skinX0, skinX1, skinY0, skinY1, NX, NY };
    }
  }
  }

  // Light bar: sized to the roof and seated just behind the top of the windscreen.
  let roofTop = box.min.y;
  for (let x = box.min.x + 0.3; x < box.max.x - 0.3; x += 0.1) {
    const q = hit(new THREE.Vector3(x, 10, 0), new THREE.Vector3(0, -1, 0));
    if (q) roofTop = Math.max(roofTop, q.y);
  }
  let roofFront = box.max.x - len * 0.3;
  for (let x = box.max.x; x > box.min.x; x -= 0.03) {
    const q = hit(new THREE.Vector3(x, 10, 0), new THREE.Vector3(0, -1, 0));
    if (q && q.y > roofTop - 0.1) { roofFront = x; break; }
  }
  const barX = roofFront - 0.32;
  const seat = hit(new THREE.Vector3(barX, 10, 0), new THREE.Vector3(0, -1, 0));
  const roofY = seat ? seat.y : roofTop;
  const sideAtRoof = hit(new THREE.Vector3(barX, roofY - 0.15, 10), new THREE.Vector3(0, 0, -1));
  const barW = (sideAtRoof ? sideAtRoof.z : 0.95) * 2 * 0.8;
  for (const z of [-barW * 0.36, barW * 0.36]) {
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.06, 0.08), black);
    foot.position.set(barX, roofY + 0.03, z);
    real.add(foot);
  }
  const bar2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.09, barW), black);
  bar2.position.set(barX, roofY + 0.1, 0);
  real.add(bar2);
  [-barW / 4, barW / 4].forEach((z, i) => {
    const led = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.06, barW / 2 - 0.08), ledMats[i]);
    led.position.set(barX + 0.005, roofY + 0.125, z);
    real.add(led);
    const glow = new THREE.PointLight(0x3d6bff, 0, 6, 1.6);
    glow.position.set(barX + 0.4, roofY + 0.35, z);
    real.add(glow);
    ledLights[i] = glow;
  });

  // Livery in the middle of the cargo side.
  liveryReady.then((mat) => {
    const width = (skinX1 - skinX0) * 0.9;
    const dh = width * 300 / 1400, dcx = (skinX0 + skinX1) / 2, dcy = yAt(0.6);
    for (const s of [1, -1]) {
      const g = real.userData["skin" + s];
      let zTop = real.userData["side" + s];
      if (g) for (let j = 0; j <= g.NY; j++) for (let i = 0; i <= g.NX; i++) {
        const x = g.skinX0 + (g.skinX1 - g.skinX0) * (i / g.NX), y = g.skinY0 + (g.skinY1 - g.skinY0) * (j / g.NY);
        if (Math.abs(x - dcx) <= width / 2 + 0.05 && Math.abs(y - dcy) <= dh / 2 + 0.05) zTop = Math.max(zTop, g.zs[j][i] + 0.004);
      }
      const decal = new THREE.Mesh(new THREE.PlaneGeometry(width, dh), mat);
      decal.position.set(dcx, dcy, s * (zTop + 0.006));
      if (s < 0) decal.rotation.y = Math.PI;
      real.add(decal);
    }
  });
  // Compile every shader before the van is shown, so its first frames don't stutter.
  Promise.race([renderer.compileAsync(scene, camera), new Promise((r) => setTimeout(r, 1200))]).then(ready, ready);
}, undefined, () => { van.visible = true; ready(); });

// ── Sizing and loop ──
function resize() {
  const w = stage.clientWidth, h = Math.round(w * 0.78);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

let visible = true;
new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(canvas);

const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  const motion = reduced ? 0 : 1;
  // A slow orbit around the front three-quarter view.
  const ang = 0.72 + Math.sin(t * 0.18) * 0.16 * motion;
  camera.position.set(target.x + Math.cos(ang) * 13, 3.2 + Math.sin(t * 0.23) * 0.15 * motion, target.z + Math.sin(ang) * 13);
  camera.lookAt(target);
  // Driving forward (+x): wheels roll, the road runs backward under the van.
  for (const w of wheels) w.rotation.z = -t * 6 * motion;
  laneTex.offset.x = (t * 0.55 * motion) % 1;
  van.position.y = Math.sin(t * 14) * 0.006 * motion;
  real.position.y = van.position.y;
  // Light bar: double strobe on one half, then the other.
  const p = (t % 0.9) / 0.9;
  const onA = p < 0.18 || (p > 0.24 && p < 0.44) || reduced;
  const onB = (p > 0.5 && p < 0.68) || (p > 0.74 && p < 0.94);
  ledMats[0].emissiveIntensity = onA ? 3.2 : 0.15;
  ledMats[1].emissiveIntensity = onB ? 3.2 : 0.15;
  ledLights[0].intensity = onA ? 9 : 0;
  ledLights[1].intensity = onB ? 9 : 0;
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(() => { if (visible) frame(); });
</script>
</body>
</html>
